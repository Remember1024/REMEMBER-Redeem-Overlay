<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMEMBER Twitch Redeem Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=Kanit:wght@300;400;500;600;700&amp;family=Mitr:wght@400;500;600&amp;family=Outfit:wght@400;600;700;800&amp;family=Prompt:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="overlay.css">
</head>

<body>
  <div class="overlay-container">
    <div id="redeemCard" class="redeem-card hidden">
      <!-- Glow ambient backdrop -->
      <div class="card-glow"></div>
      
      <!-- Single row content: @user #แต้มที่แลก -->
      <div class="card-content-row">
        <span class="user-chunk">
          <span class="prefix-at">@</span><span id="viewerName" class="viewer-name">ViewerName</span>
        </span>
        <span class="reward-chunk">
          <span class="prefix-hash">#</span><span id="rewardTitle" class="reward-title">Reward Title</span>
        </span>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
